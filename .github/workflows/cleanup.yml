name: cleanup
on:
  schedule:
    - cron: "0 0,12 * * *"  # every 12 hours
env:
  WERF_REPO: "ghcr.io/g-core/access-control"
jobs:
  cleanup_registry:
    runs-on: [ "self-hosted-ubuntu-22-04-regular-x64" ]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install werf
        uses: werf/actions/install@v1.2

      - name: Registry login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_REGISTRY_USERNAME }}
          password: ${{ secrets.GHCR_REGISTRY_PASSWORD }}

      - name: Build
        # default policy
        # https://werf.io/documentation/v1.2/usage/cleanup/cr_cleanup.html#default-policies
        # TODO: connect to k8s
        run: werf cleanup --without-kube=true
